<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'Inter';font-weight:100 900;src:url(/home/user/han-research/creative/1000th-man-reel/fonts/inter-latin.woff2) format('woff2')}
@font-face{font-family:'Inter Tight';font-weight:100 900;src:url(/home/user/han-research/creative/1000th-man-reel/fonts/intertight-latin.woff2) format('woff2')}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#0A0709}
#s{position:relative;width:1080px;height:1920px;overflow:hidden;background:#E6007E}
#dots{position:absolute;inset:0;background-image:radial-gradient(circle at center,rgba(10,7,9,.55) 2.2px,transparent 2.6px);background-size:14px 14px}
#freeze{position:absolute;inset:0;background:url(freeze.png) center/cover;filter:grayscale(1) contrast(1.6)}
#sam{position:absolute;left:50%;bottom:0;width:1300px;height:1400px;background:url(cutcrop.png) center bottom/contain no-repeat;transform-origin:50% 100%}
#chev{position:absolute;left:-60px;right:-60px;top:210px;transform-origin:50% 50%}
#chev .band{background:#E4FF3D;padding:26px 0 30px;text-align:center;border-top:12px solid #0A0709;border-bottom:12px solid #0A0709}
#chev .stripe{height:34px;background:url(/home/user/hard-as-nails-site/.claude/skills/han-brand/pptx/chev.png) left/auto 100% repeat-x}
#chev .t{font-family:'Inter Tight';font-weight:900;text-transform:uppercase;letter-spacing:-.02em;color:#0A0709;line-height:.9}
#chev .t1{font-size:150px}
#chev .t2{font-size:96px;margin-top:6px}
#wm{position:absolute;left:0;top:56px;background:#0A0709;padding:16px 26px 16px 64px;font-family:'Inter Tight';font-weight:900;font-size:34px;letter-spacing:.06em;text-transform:uppercase;color:#F3ECEF;z-index:9}
#wm span{color:#E6007E}
#cap{position:absolute;left:0;right:0;bottom:0;background:#0A0709;border-top:3px solid #E6007E;padding:44px 64px 90px;z-index:8}
#cap .d{font-family:'Inter Tight';font-weight:900;text-transform:uppercase;letter-spacing:-.02em;line-height:.92;font-size:84px;color:#F3ECEF}
#cap em{font-style:normal;color:#E4FF3D}
</style></head><body><div id="s">
<div id="dots"></div><div id="sam"></div><div id="freeze"></div>
<div id="chev"><div class="stripe"></div><div class="band"><div class="t t1">Real science.</div><div class="t t2">Guaranteed.*</div></div><div class="stripe"></div></div>
<div id="wm">Hard As <span>Nails</span></div>
<div id="cap"><div class="d">The <em>surprising science</em> nails taught me.</div></div>
</div><script>
const $=s=>document.querySelector(s);const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));const seg=(t,a,b)=>clamp((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3); const back=x=>{const c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
window.render=function(t){
  // 0-0.12: frozen frame goes hard black and white, then cut to poster
  $('#freeze').style.opacity=t<0.14?1:0;
  const p=seg(t,0.14,0.42); $('#sam').style.transform=`translateX(-50%) scale(${1.18-0.18*eo(p)})`;
  const q=seg(t,0.45,0.75); const r=back(q);
  $('#chev').style.transform=`rotate(${-7}deg) translateX(${(1-q)*-1300}px) scale(${q<1?0.9+0.1*r:1})`;
  $('#chev .t2').style.opacity=t>0.95?1:0;
  $('#dots').style.backgroundPosition=`${t*20}px ${t*12}px`;
};
window.READY=document.fonts.ready.then(()=>new Promise(r=>setTimeout(r,300)));
</script></body></html>
