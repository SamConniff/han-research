<!doctype html><html><head><meta charset="utf-8"><title>Love You Mate</title>
<style>
@font-face{font-family:'Inter';font-weight:100 900;src:url(fonts/inter-latin.woff2) format('woff2')}
@font-face{font-family:'Inter Tight';font-weight:100 900;src:url(fonts/intertight-latin.woff2) format('woff2')}
:root{--black:#0A0709;--pink:#E6007E;--acid:#E4FF3D;--paper:#F3ECEF}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#333;display:flex;gap:40px;padding:40px;align-items:flex-start}
.ab{position:relative;overflow:hidden;background-color:var(--black);
  background-image:radial-gradient(circle at center,rgba(230,0,126,.32) 1px,transparent 1.3px);background-size:7px 7px;color:var(--paper)}
.t{position:absolute;left:72px;font-family:'Inter Tight',sans-serif;font-weight:900;text-transform:uppercase;letter-spacing:-.035em;line-height:.84}
.t .p{color:var(--pink)}
.chev{position:absolute;left:0;right:0;height:26px;background:repeating-linear-gradient(-45deg,var(--acid) 0 26px,var(--black) 26px 52px)}
.mark{position:absolute;left:72px;font-family:'Inter Tight',sans-serif;font-weight:900;font-size:34px;letter-spacing:.06em;text-transform:uppercase;border-top:3px solid var(--pink);padding-top:22px}
.mark span{color:var(--pink)}
</style></head><body>
<div class="ab" data-artboard="love-you-mate-square" style="width:1080px;height:1080px">
  <div class="chev" style="top:0"></div>
  <div class="t" style="top:250px;font-size:250px">Love<br>you<br><span class="p">mate.</span></div>
  <div class="mark" style="bottom:72px">Hard As Nails<span>.</span></div>
</div>
<div class="ab" data-artboard="love-you-mate-story" style="width:1080px;height:1920px">
  <div class="chev" style="top:0"></div>
  <div class="t" style="top:560px;font-size:300px">Love<br>you<br><span class="p">mate.</span></div>
  <div class="mark" style="bottom:200px">Hard As Nails<span>.</span></div>
</div>
</body></html>
